apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-lite
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/TerenceLiu98/homelab.git
      targetRevision: experimental
      path: platform/kubeflow
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
