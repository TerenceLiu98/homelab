apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gitea
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 12.6.0
    helm:
      releaseName: gitea
      values: |
        namespace: gitea
        replicaCount: 1
        nodeSelector:
          kubernetes.io/hostname: optiplex5060

        global:
          storageClass: juicefs-sc

        image:
          rootless: true

        service:
          http:
            type: ClusterIP
            port: 3000
            clusterIP: ""
          ssh:
            type: ClusterIP
            clusterIP: ""

        ingress:
          enabled: true
          className: traefik
          hosts:
            - host: git.initio.cc
              paths:
                - path: /
          tls:
            - secretName: initio-cc-tls
              hosts:
                - git.initio.cc

        persistence:
          enabled: true
          create: true
          claimName: gitea-shared-storage-v2
          storageClass: juicefs-sc
          size: 50Gi
          accessModes:
            - ReadWriteOnce

        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 2Gi

        initContainers:
          resources:
            requests:
              cpu: 10m
              memory: 128Mi

        deployment:
          strategy:
            type: Recreate
          env:
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-actions-token
                  key: token

        gitea:
          admin:
            existingSecret: gitea-admin
            email: admin@initio.cc
            passwordMode: initialOnlyNoReset
          oauth:
            - name: dex
              provider: openidConnect
              existingSecret: gitea-oauth-dex
              autoDiscoverUrl: http://dex.identity.svc.cluster.local:5556/.well-known/openid-configuration
              scopes: openid email profile
          config:
            APP_NAME: Homelab Gitea
            server:
              DOMAIN: git.initio.cc
              ROOT_URL: https://git.initio.cc/
              PROTOCOL: http
              HTTP_PORT: 3000
              DISABLE_SSH: true
            service:
              REQUIRE_SIGNIN_VIEW: false
              DISABLE_REGISTRATION: false
              ALLOW_ONLY_EXTERNAL_REGISTRATION: false
              SHOW_REGISTRATION_BUTTON: false
            actions:
              ENABLED: true
            database:
              DB_TYPE: sqlite3
              PATH: /data/gitea/gitea.db

        valkey-cluster:
          enabled: false
        valkey:
          enabled: false
        postgresql-ha:
          enabled: false
        postgresql:
          enabled: false

        test:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
