apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: default
  source:
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    targetRevision: 3.8.1
    helm:
      values: |-
        admissionController:
          replicas: 1
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
        backgroundController:
          replicas: 1
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
        cleanupController:
          replicas: 1
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
        reportsController:
          replicas: 1
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
