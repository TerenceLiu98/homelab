apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-gitea-actions
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: actions
    targetRevision: 0.1.1
    helm:
      releaseName: gitea-actions
      values: |
        enabled: true
        giteaRootURL: http://gitea-http.gitea.svc.cluster.local:3000
        existingSecret: gitea-actions-token
        existingSecretKey: token

        global:
          storageClass: juicefs-sc

        statefulset:
          replicas: 1
          timezone: Europe/Dublin
          persistence:
            size: 5Gi
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          runner:
            tag: 1.0.4
            flushCache: true
            config: |
              log:
                level: info
              cache:
                enabled: true
                dir: /data/cache
              container:
                require_docker: true
                docker_timeout: 300s
          dind:
            tag: 29.5.1-dind
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
