apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dex-data
  namespace: identity
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: juicefs-sc
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: identity
spec:
  selector:
    app.kubernetes.io/name: dex
  ports:
    - name: http
      port: 5556
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dex
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.43.1
          imagePullPolicy: IfNotPresent
          command:
            - dex
          args:
            - serve
            - /etc/dex/config.yaml
          ports:
            - name: http
              containerPort: 5556
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            - name: data
              mountPath: /var/dex
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          secret:
            secretName: dex-config
        - name: data
          persistentVolumeClaim:
            claimName: dex-data
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dex
  namespace: identity
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.erotica.icu
      secretName: erotica-icu-tls
  rules:
    - host: auth.erotica.icu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dex
                port:
                  name: http
