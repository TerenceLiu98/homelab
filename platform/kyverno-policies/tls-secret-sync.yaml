---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-erotica-icu-tls-to-ingress-namespaces
spec:
  background: true
  rules:
    - name: clone-erotica-icu-tls-to-argocd
      match:
        any:
          - resources:
              kinds:
                - Ingress
              namespaces:
                - argocd
      generate:
        apiVersion: v1
        kind: Secret
        name: erotica-icu-tls
        namespace: argocd
        synchronize: true
        clone:
          namespace: kyverno
          name: erotica-icu-tls
        generateExisting: true
    - name: clone-erotica-icu-tls-to-identity
      match:
        any:
          - resources:
              kinds:
                - Ingress
              namespaces:
                - identity
      generate:
        apiVersion: v1
        kind: Secret
        name: erotica-icu-tls
        namespace: identity
        synchronize: true
        clone:
          namespace: kyverno
          name: erotica-icu-tls
        generateExisting: true
    - name: clone-erotica-icu-tls-to-istio-system
      match:
        any:
          - resources:
              kinds:
                - Ingress
              namespaces:
                - istio-system
      generate:
        apiVersion: v1
        kind: Secret
        name: erotica-icu-tls
        namespace: istio-system
        synchronize: true
        clone:
          namespace: kyverno
          name: erotica-icu-tls
        generateExisting: true
