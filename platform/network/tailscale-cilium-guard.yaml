apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tailscale-cilium-guard
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-cilium-guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale-cilium-guard
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: guard
          image: quay.io/cilium/cilium:v1.19.4
          command:
            - /usr/bin/sh
            - -ec
            - |
              while true; do
                nsenter -t 1 -m -u -i -n -p -- /usr/bin/nft add table inet tailscale_cilium_guard 2>/dev/null || true
                nsenter -t 1 -m -u -i -n -p -- /usr/bin/nft 'add chain inet tailscale_cilium_guard output { type filter hook output priority 0; policy accept; }' 2>/dev/null || true
                if ! nsenter -t 1 -m -u -i -n -p -- /usr/bin/nft list chain inet tailscale_cilium_guard output 2>/dev/null | grep -q 'ip daddr 10.42.0.0/16 udp dport 41641 reject'; then
                  nsenter -t 1 -m -u -i -n -p -- /usr/bin/nft add rule inet tailscale_cilium_guard output ip daddr 10.42.0.0/16 udp dport 41641 reject
                fi
                sleep 3600
              done
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
