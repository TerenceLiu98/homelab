apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - kube-prometheus-stack.yaml
  - istiod-servicemonitor.yaml
configMapGenerator:
  - name: grafana-dashboards
    namespace: monitoring
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - dashboards/homelab-aio.json