apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kube-prometheus-stack
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  version: 88.5.2
  targetNamespace: monitoring
  createNamespace: false
  valuesContent: |-
    fullnameOverride: kps

    # k3s specifics: components bind localhost / are replaced by Cilium
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    coreDns:
      enabled: true

    defaultRules:
      create: true

    prometheusOperator:
      tolerations:
        - key: workload
          operator: Equal
          value: kubeflow
          effect: NoSchedule
      resources:
        requests:
          cpu: 100m
          memory: 192Mi
        limits:
          memory: 512Mi

    prometheus:
      prometheusSpec:
        retention: 7d
        retentionSize: 8GB
        scrapeInterval: 30s
        evaluationInterval: 60s
        # local-path-thinkpad provisioner only serves this node
        nodeSelector:
          kubernetes.io/hostname: thinkpadx13-2022
        tolerations:
          - key: workload
            operator: Equal
            value: kubeflow
            effect: NoSchedule
        resources:
          requests:
            cpu: 300m
            memory: 1Gi
          limits:
            memory: 2Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path-thinkpad
              resources:
                requests:
                  storage: 15Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        additionalScrapeConfigs:
          # Istio envoy sidecars: every pod with an istio-proxy container
          - job_name: istio-envoy-sidecars
            metrics_path: /stats/prometheus
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels:
                  [__meta_kubernetes_pod_container_name]
                action: keep
                regex: istio-proxy
              - source_labels: [__meta_kubernetes_pod_ip]
                action: replace
                regex: (.+)
                target_label: __address__
                replacement: ${1}:15090
              - source_labels: [__meta_kubernetes_namespace]
                action: replace
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_name]
                action: replace
                target_label: pod
          # Cilium agent metrics (:9962, enabled via redeploy-k3s.sh helm sets)
          - job_name: cilium-agent
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - kube-system
            relabel_configs:
              - source_labels:
                  [__meta_kubernetes_pod_label_k8s_app]
                action: keep
                regex: cilium
              - source_labels: [__meta_kubernetes_pod_ip]
                action: replace
                regex: (.+)
                target_label: __address__
                replacement: ${1}:9962
          # Cilium operator metrics (:9963)
          - job_name: cilium-operator
            kubernetes_sd_configs:
              - role: pod
                namespaces:
                  names:
                    - kube-system
            relabel_configs:
              - source_labels:
                  [__meta_kubernetes_pod_label_io_cilium_k8s_app]
                action: keep
                regex: cilium-operator
              - source_labels: [__meta_kubernetes_pod_ip]
                action: replace
                regex: (.+)
                target_label: __address__
                replacement: ${1}:9963

    alertmanager:
      tolerations:
        - key: workload
          operator: Equal
          value: kubeflow
          effect: NoSchedule
      alertmanagerSpec:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        retention: 120h
      config:
        route:
          group_by:
            - alertname
            - namespace
          receiver: 'null'
        receivers:
          - name: 'null'

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      tolerations:
        - key: workload
          operator: Equal
          value: kubeflow
          effect: NoSchedule
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      persistence:
        enabled: false
      testFramework:
        enabled: false
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grafana.initio.cc
        tls:
          - secretName: initio-cc-tls
            hosts:
              - grafana.initio.cc
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oauth-dex
            key: client-secret
      grafana.ini:
        server:
          domain: grafana.initio.cc
          root_url: https://grafana.initio.cc
        auth.generic_oauth:
          enabled: true
          name: Dex
          icon: signin
          client_id: grafana
          auth_url: https://auth.initio.cc/auth
          token_url: http://dex.identity.svc.cluster.local:5556/token
          api_url: http://dex.identity.svc.cluster.local:5556/userinfo
          scopes: "openid profile email groups"
          allow_sign_up: true
        users:
          auto_assign_org_role: Editor
        analytics:
          reporting_enabled: false
          check_for_updates: false

    kube-state-metrics:
      tolerations:
        - key: workload
          operator: Equal
          value: kubeflow
          effect: NoSchedule
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
        limits:
          memory: 256Mi

    prometheus-node-exporter:
      tolerations:
        - operator: Exists