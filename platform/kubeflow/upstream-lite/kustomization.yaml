apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

sortOptions:
  order: legacy
  legacySortOptions:
    orderFirst:
      - Namespace
      - ResourceQuota
      - StorageClass
      - CustomResourceDefinition
      - MutatingWebhookConfiguration
      - ServiceAccount
      - NetworkPolicy
      - Role
      - ClusterRole
      - RoleBinding
      - ClusterRoleBinding
      - ConfigMap
      - Secret
      - Endpoints
      - Service
      - Deployment
      - StatefulSet
    orderLast:
      - ValidatingWebhookConfiguration

resources:
  - https://github.com/kubeflow/manifests//common/cert-manager/base?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/cert-manager/kubeflow-issuer/base?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/istio/istio-crds/base?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/istio/istio-namespace/base?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/istio/istio-install/overlays/oauth2-proxy?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/oauth2-proxy/overlays/m2m-dex-only?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/dex/overlays/oauth2-proxy?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/knative/knative-serving/overlays/gateways?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/istio/cluster-local-gateway/base?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/kubeflow-namespace/base?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/networkpolicies/base?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/kubeflow-roles/base?ref=v1.11.0
  - https://github.com/kubeflow/manifests//common/istio/kubeflow-istio-resources/base?ref=v1.11.0
  - https://github.com/kubeflow/manifests//applications/centraldashboard/overlays/oauth2-proxy?ref=v1.11.0
  - https://github.com/kubeflow/manifests//applications/admission-webhook/upstream/overlays/cert-manager?ref=v1.11.0
  - https://github.com/kubeflow/manifests//applications/jupyter/jupyter-web-app/upstream/overlays/istio?ref=v1.11.0
  - https://github.com/kubeflow/manifests//applications/jupyter/notebook-controller/upstream/overlays/kubeflow?ref=v1.11.0
  - https://github.com/kubeflow/manifests//applications/profiles/pss?ref=v1.11.0
  - https://github.com/kubeflow/manifests//applications/pvcviewer-controller/upstream/base?ref=v1.11.0
  - https://github.com/kubeflow/manifests//applications/volumes-web-app/upstream/overlays/istio?ref=v1.11.0
  - knative-autoscaler-destinationrule.yaml

components:
  - https://github.com/kubeflow/manifests//common/security/PSS/dynamic/baseline?ref=v1.11.0
