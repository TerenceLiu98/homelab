apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeflow-upstream
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kubeflow/manifests.git
    targetRevision: v1.11.0
    path: example
    kustomize:
      patches:
        - target:
            kind: Profile
          patch: |-
            - op: replace
              path: /metadata/name
              value: terenceliu
            - op: replace
              path: /spec/owner/name
              value: me@cklau.cc
        - target:
            group: apps
            version: v1
            kind: Deployment
            name: dex
            namespace: auth
          patch: |-
            - op: replace
              path: /spec/replicas
              value: 0
        - target:
            group: apps
            version: v1
            kind: Deployment
            name: oauth2-proxy
            namespace: oauth2-proxy
          patch: |-
            - op: replace
              path: /spec/template/spec/containers/0/env/0/valueFrom/secretKeyRef/name
              value: oauth2-proxy-global-dex
            - op: replace
              path: /spec/template/spec/containers/0/env/1/valueFrom/secretKeyRef/name
              value: oauth2-proxy-global-dex
            - op: replace
              path: /spec/template/spec/volumes/0/configMap/name
              value: oauth2-proxy-global-dex-config
        - target:
            group: security.istio.io
            version: v1beta1
            kind: RequestAuthentication
            name: dex-jwt
            namespace: istio-system
          patch: |-
            - op: replace
              path: /spec/jwtRules/0/issuer
              value: https://auth.erotica.icu
            - op: add
              path: /spec/jwtRules/0/jwksUri
              value: http://dex.identity.svc.cluster.local:5556/keys
        - target:
            group: networking.istio.io
            kind: DestinationRule
            namespace: kubeflow
          patch: |-
            - op: replace
              path: /spec/trafficPolicy/tls/mode
              value: DISABLE
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jsonPointers:
        - /webhooks
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      jsonPointers:
        - /rules
    - group: apps
      kind: Deployment
      name: cluster-local-gateway
      namespace: istio-system
      jsonPointers:
        - /spec
    - group: apps
      kind: Deployment
      name: istio-ingressgateway
      namespace: istio-system
      jsonPointers:
        - /spec
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
